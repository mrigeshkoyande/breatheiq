services:
  - type: web
    name: breatheiq-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: breatheiq-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: breatheiq-db
    region: singapore
    plan: free
