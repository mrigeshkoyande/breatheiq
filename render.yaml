services:
  - type: web
    name: breatheiq
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: breatheiq-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: breatheiq-db
    region: singapore
    plan: free
