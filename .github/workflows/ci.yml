name: BreatheIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-size:
    name: Repository Size Budget (< 8 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Repository Size Budget
        run: python scripts/check_repo_size.py

  backend-check:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run Backend Tests
        run: |
          if [ -d backend/tests ]; then pytest backend/tests; fi

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm ci; fi
      - name: Typecheck and Build
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm run build; fi
