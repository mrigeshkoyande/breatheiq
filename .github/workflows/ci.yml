name: BreatheIQ Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-audits:
    name: Backend Pytest & Truth Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint and Format Check Backend & Scripts (Ruff)
        run: |
          ruff format --check backend scripts
          ruff check backend scripts

      - name: Typecheck Backend (Mypy Strict)
        run: |
          cd backend
          mypy --config-file ../pyproject.toml -p app

      - name: Security Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests with Branch Coverage
        run: |
          cd backend
          pytest tests --cov=app --cov-config=.coveragerc --cov-branch --cov-fail-under=95 --cov-report=term-missing -q

      - name: Enforce Truth & Anti-Hallucination Claims Check
        run: |
          python scripts/check_claims.py

      - name: Enforce Anti-Stub & Completeness Check
        run: |
          python scripts/audit_stubs.py

      - name: Audit Route Ledger Build Status
        run: |
          python scripts/build_status.py

      - name: Enforce Repository Size Budget (< 1.5 MB tracked)
        run: |
          python scripts/check_repo_size.py

  frontend-build-and-test:
    name: Frontend Lint, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint and Format Check Frontend (Prettier + ESLint + jsx-a11y)
        run: |
          cd frontend
          npm run format:check
          npm run lint

      - name: TypeScript Strict Typecheck & Vite Production Build
        run: |
          cd frontend
          npm run typecheck
          npm run build

      - name: Frontend Bundle Budget Audit
        run: |
          python scripts/measure_bundle.py

      - name: Frontend Security Audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run Frontend Unit Tests with Coverage
        run: |
          cd frontend
          npm run test:coverage
